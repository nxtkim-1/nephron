    <g id="Stage_3_Carbon_Filters">
      <rect x="556" y="324" width="302" height="196" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2.4"/>
      <text x="707" y="350" text-anchor="middle" fill="#1C1917" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="800">Carbon Filters (Traps Pesticide)</text>
      <g id="Buried_Filter1">
        <rect x="590" y="366" width="60" height="110" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1.4"/>
        <rect x="593" y="458" width="54" height="15" rx="4" fill="#16a34a"/>
        <line x1="587" y1="456" x2="653" y2="456" stroke="#1C1917" stroke-width="2.4" stroke-dasharray="4 3"/>
        <text x="620" y="501" text-anchor="middle" fill="#1C1917" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700">14%</text>
      </g>
      <g id="Buried_Filter2">
        <rect x="676" y="366" width="60" height="110" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1.4"/>
        <rect x="679" y="467" width="54" height="6" rx="4" fill="#16a34a"/>
        <line x1="673" y1="466" x2="739" y2="466" stroke="#1C1917" stroke-width="2.4" stroke-dasharray="4 3"/>
        <text x="706" y="501" text-anchor="middle" fill="#1C1917" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700">6%</text>
      </g>
      <g id="Buried_Filter3">
        <rect x="762" y="366" width="60" height="110" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1.4"/>
        <rect x="765" y="467" width="54" height="6" rx="4" fill="#16a34a"/>
        <line x1="759" y1="467" x2="825" y2="467" stroke="#1C1917" stroke-width="2.4" stroke-dasharray="4 3"/>
        <text x="792" y="501" text-anchor="middle" fill="#1C1917" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700">2%</text>
      </g>
    </g>

    <!-- Stage 4: Clean Water -->
    <g id="Stage_4_Clean_Water" transform="translate(944, 352)">
      <rect width="166" height="146" rx="10" fill="#F0F9FF" stroke="#1C1917" stroke-width="1.6"/>
      <path d="M83 22C83 22 62 50 62 66A21 21 0 0 0 104 66C104 50 83 22 83 22Z" fill="#0284C7"/>
      <polyline points="73,66 80,73 93,59" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="83" y="114" text-anchor="middle" fill="#1C1917" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">Clean Water</text>
      <text x="83" y="132" text-anchor="middle" fill="#0369A1" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Pesticide Removed</text>
    </g>
  </g>

  <!-- Footer Caption + Key -->
  <g id="Footer">
    <text x="56" y="600" fill="#1C1917" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gate set to Cleaning. Fresh carbon filters ready before spring spraying.</text>
    <text x="56" y="632" fill="#57534E" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12">Color bar = Phone Twin estimate  ·  Dashed line = Real buried filter  ·  49% pesticide caught with Twin vs. 34% swapping once a year</text>
    <g transform="translate(996, 616)">
      <rect x="0" y="0" width="30" height="8" rx="4" fill="#6D28D9"/>
      <rect x="38" y="0" width="30" height="8" rx="4" fill="#D6D3D1"/>
      <rect x="76" y="0" width="30" height="8" rx="4" fill="#D6D3D1"/>
      <rect x="114" y="0" width="30" height="8" rx="4" fill="#D6D3D1"/>
    </g>
  </g>
</svg>
